<header class="site-header">
  <div class="container topbar">
    <button
      class="menu-toggle"
      type="button"
      aria-label="باز کردن منو"
      aria-expanded="false"
      aria-controls="site-menu"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <a href="{{BASE}}index.html" class="logo">تک تجارت</a>

    <button
      class="cart-header-btn"
      type="button"
      data-open-cart
      aria-label="باز کردن سبد خرید"
    >
      <span class="cart-header-btn__icon">🛒</span>
      <span class="cart-header-btn__text">سبد خرید</span>
      <span class="cart-badge" data-cart-count hidden>0</span>
    </button>

    <nav class="nav" id="site-menu" aria-label="منوی اصلی">
      <a href="{{BASE}}index.html">خانه</a>
      <a href="{{BASE}}products.html">محصولات</a>
      <a href="{{BASE}}about.html">درباره ما</a>
      <a href="{{BASE}}contact.html">تماس با ما</a>
      <a href="{{BASE}}account.html">حساب کاربری</a>

      <!-- ==========================================
      لینک ورود/ثبت‌نام در هدر - با قابلیت غیرفعال‌سازی
      ========================================== -->
      <a href="{{BASE}}login.html" data-auth-guest id="header-register-link">ورود/ثبت نام</a>

      <button
        type="button"
        class="nav-logout-btn"
        data-auth-user
        data-logout-trigger
        hidden
      >
        خروج از سایت
      </button>
    </nav>
  </div>
</header>

<!-- ==========================================
اسکریپت برای کنترل لینک ثبت‌نام در هدر
========================================== -->
<script>
  (function() {
    'use strict';

    // صبر کردن برای بارگذاری کامل DOM
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initHeaderLink);
    } else {
      initHeaderLink();
    }

    async function initHeaderLink() {
      const registerLink = document.getElementById('header-register-link');
      if (!registerLink) return;

      // اگر کاربر لاگین است، لینک را مخفی کن (توسط Auth مدیریت می‌شود)
      // فقط در صورتی که کاربر لاگین نباشد، رفتار را کنترل کن

      try {
        const response = await fetch('/api/admin/settings', {
          credentials: 'same-origin',
          headers: { Accept: 'application/json' }
        });
        const data = await response.json().catch(() => null);

        if (!response.ok || !data?.success) {
          // در صورت خطا، لینک را فعال نگه دار
          registerLink.href = '{{BASE}}login.html';
          registerLink.classList.remove('is-disabled');
          return;
        }

        const settings = data.settings || {};
        const isEnabled = String(settings.allow_public_registration || 'true').toLowerCase() === 'true';

        if (isEnabled) {
          // ثبت‌نام فعال است
          registerLink.href = '{{BASE}}login.html';
          registerLink.classList.remove('is-disabled');
          registerLink.style.opacity = '1';
          registerLink.style.pointerEvents = 'auto';
        } else {
          // ثبت‌نام غیرفعال است - لینک را به login.html نگه دار اما با رفتار Modal
          registerLink.href = 'javascript:void(0)';
          registerLink.style.pointerEvents = 'auto';
          registerLink.style.cursor = 'pointer';
          registerLink.style.opacity = '1';

          // حذف event listener قدیمی
          const newLink = registerLink.cloneNode(true);
          registerLink.parentNode.replaceChild(newLink, registerLink);

          newLink.addEventListener('click', function(e) {
            e.preventDefault();
            showRegistrationModal();
          });
        }
      } catch (_) {
        // در صورت خطا، لینک را فعال نگه دار
        registerLink.href = '{{BASE}}login.html';
      }
    }

    // ==========================================
    // تابع نمایش Modal (همانند login.html)
    // ==========================================
    function showRegistrationModal() {
      // بررسی می‌کنیم که آیا Modal از قبل وجود دارد یا نه
      let modal = document.getElementById('header-registration-modal');

      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'header-registration-modal';
        modal.className = 'auth-modal-overlay';
        modal.style.cssText = `
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          backdrop-filter: blur(4px);
          display: none;
          align-items: center;
          justify-content: center;
          z-index: 1000;
          padding: 20px;
        `;

        modal.innerHTML = `
          <div class="auth-modal" style="
            max-width: 440px;
            width: 100%;
            background: #fff;
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            position: relative;
            animation: authModalIn 0.3s ease;
          ">
            <button class="auth-modal-close-btn" style="
              position: absolute;
              top: 12px;
              left: 16px;
              background: none;
              border: none;
              font-size: 24px;
              color: var(--muted, #94a3b8);
              cursor: pointer;
              line-height: 1;
            ">✕</button>
            <div style="font-size: 48px;margin-bottom:16px;">🔒</div>
            <h3 style="margin:0 0 12px;color:var(--primary,#064e3b);font-size:1.2rem;">ثبت‌نام غیرفعال</h3>
            <p style="margin:0 0 20px;color:var(--text-soft,#334155);line-height:2;font-size:0.98rem;">
              ثبت‌نام کاربر توسط مدیریت سایت انجام می‌شود.<br />
              لطفاً با پشتیبانی با شماره 
              <span style="
                display: inline-block;
                direction: ltr;
                font-weight: 700;
                color: var(--secondary,#219ebc);
                font-size: 1.1rem;
                padding: 2px 10px;
                background: rgba(33, 158, 188, 0.08);
                border-radius: 6px;
              ">۰۹۲۱۴۱۴۷۰۷۰</span>
              تماس حاصل فرمایید.
            </p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
              <button class="btn btn-primary" id="header-modal-ok" style="min-width:120px;">متوجه شدم</button>
            </div>
          </div>
        `;

        // اضافه کردن استایل انیمیشن
        const style = document.createElement('style');
        style.textContent = `
          @keyframes authModalIn {
            from { opacity: 0; transform: scale(0.92) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
          }
          .auth-modal-overlay.is-active { display: flex !important; }
        `;
        document.head.appendChild(style);

        document.body.appendChild(modal);

        // رویدادهای Modal
        const closeBtn = modal.querySelector('.auth-modal-close-btn');
        const okBtn = modal.querySelector('#header-modal-ok');

        function hideModal() {
          modal.classList.remove('is-active');
          document.body.style.overflow = '';
        }

        if (closeBtn) closeBtn.addEventListener('click', hideModal);
        if (okBtn) okBtn.addEventListener('click', hideModal);

        modal.addEventListener('click', function(e) {
          if (e.target === this) hideModal();
        });

        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && modal.classList.contains('is-active')) {
            hideModal();
          }
        });
      }

      modal.classList.add('is-active');
      document.body.style.overflow = 'hidden';
    }
  })();
</script>
