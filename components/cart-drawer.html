<div class="cart-overlay" data-cart-overlay hidden></div>

<aside
  class="cart-drawer"
  data-cart-drawer
  aria-label="سبد خرید"
  aria-hidden="true"
>
  <div class="cart-drawer__head">
    <div>
      <h3>سبد خرید</h3>
      <p class="cart-drawer__count" data-cart-count-label>۰ محصول</p>
    </div>

    <button type="button" data-close-cart aria-label="بستن سبد خرید">×</button>
  </div>

  <div class="cart-drawer__body">
    <p data-cart-empty>هنوز محصولی به سبد خرید اضافه نشده است.</p>
    <div data-cart-items></div>
  </div>

  <div class="cart-drawer__footer">
    <div class="cart-drawer__total-row">
      <span>جمع کل</span>
      <strong data-cart-total>۰ تومان</strong>
    </div>

    <a href="{{BASE}}checkout.html" class="btn btn-primary">ادامه و ثبت سفارش</a>
  </div>
</aside>
