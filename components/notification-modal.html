<div
  id="notificationModal"
  class="notification-modal"
  style="display: none;"
>
  <div class="notification-modal-overlay">

    <div
      class="notification-modal-content"
      role="dialog"
      aria-modal="true"
      aria-labelledby="notificationModalTitle"
    >

      <div class="notification-modal-icon">
        🔔
      </div>

      <h3
        id="notificationModalTitle"
        class="notification-modal-title"
      >
        فعال‌سازی اعلان‌ها
      </h3>

      <p class="notification-modal-text">
        برای دریافت اطلاع‌رسانی درباره سفارش‌ها،
        تغییرات وضعیت و تخفیف‌های ویژه،
        لطفاً اعلان‌های مرورگر را فعال کنید.
      </p>

      <div class="notification-modal-actions">

        <button
          id="notificationAcceptBtn"
          type="button"
          class="btn btn-primary"
        >
          ✅ فعال‌سازی اعلان‌ها
        </button>

        <button
          id="notificationSkipBtn"
          type="button"
          class="btn btn-secondary"
        >
          ⏭️ بعداً
        </button>

      </div>

      <p class="notification-modal-note">
        💡 می‌توانید بعداً از
        <a href="/account.html">
          حساب کاربری
        </a>
        این تنظیمات را تغییر دهید.
      </p>

    </div>

  </div>
</div>


<style>
  /* ============================================
     Modal اصلی
     ============================================ */

  .notification-modal {
    position: fixed;
    inset: 0;
    z-index: 999999;

    display: none;

    width: 100%;
    height: 100%;

    padding: 20px;

    box-sizing: border-box;
  }


  /* ============================================
     Overlay
     ============================================ */

  .notification-modal-overlay {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    box-sizing: border-box;

    background: rgba(0, 0, 0, 0.6);

    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);

    overflow-y: auto;
  }


  /* ============================================
     محتوای Modal
     ============================================ */

  .notification-modal-content {
    position: relative;

    width: min(420px, 100%);

    max-width: 420px;

    max-height: calc(100vh - 40px);

    overflow-y: auto;

    box-sizing: border-box;

    margin: auto;

    background: #ffffff;

    padding: 40px 35px 30px;

    border-radius: 16px;

    text-align: center;

    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.3);

    animation:
      notificationSlideUp
      0.4s ease;
  }


  /* ============================================
     آیکن
     ============================================ */

  .notification-modal-icon {
    font-size: 56px;

    line-height: 1;

    margin-bottom: 14px;

    display: block;
  }


  /* ============================================
     عنوان
     ============================================ */

  .notification-modal-title {
    font-size: 22px;

    font-weight: 700;

    color: #1a1a2e;

    margin: 0 0 12px;
  }


  /* ============================================
     متن
     ============================================ */

  .notification-modal-text {
    font-size: 15px;

    color: #555555;

    line-height: 1.8;

    margin: 0 0 24px;
  }


  /* ============================================
     دکمه‌ها
     ============================================ */

  .notification-modal-actions {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    width: 100%;

    flex-wrap: wrap;
  }


  .notification-modal-actions .btn {
    min-width: 160px;

    padding: 12px 20px;

    font-size: 15px;

    border-radius: 10px;

    border: none;

    cursor: pointer;

    transition:
      transform 0.2s ease,
      background 0.2s ease,
      opacity 0.2s ease;

    box-sizing: border-box;
  }


  /* ============================================
     دکمه فعال‌سازی
     ============================================ */

  .notification-modal-actions .btn-primary {
    background: #2d7a3a;

    color: #ffffff;
  }


  .notification-modal-actions .btn-primary:hover {
    background: #1f5a2a;

    transform: translateY(-2px);
  }


  .notification-modal-actions .btn-primary:disabled {
    opacity: 0.65;

    cursor: wait;

    transform: none;
  }


  /* ============================================
     دکمه بعداً
     ============================================ */

  .notification-modal-actions .btn-secondary {
    background: #e9ecef;

    color: #495057;
  }


  .notification-modal-actions .btn-secondary:hover {
    background: #dee2e6;
  }


  /* ============================================
     توضیحات پایین Modal
     ============================================ */

  .notification-modal-note {
    font-size: 13px;

    color: #888888;

    line-height: 1.7;

    margin: 16px 0 0;
  }


  .notification-modal-note a {
    color: #2d7a3a;

    text-decoration: none;

    font-weight: 600;
  }


  .notification-modal-note a:hover {
    text-decoration: underline;
  }


  /* ============================================
     انیمیشن ورود
     ============================================ */

  @keyframes notificationFadeIn {
    from {
      opacity: 0;
    }

    to {
      opacity: 1;
    }
  }


  @keyframes notificationSlideUp {
    from {
      opacity: 0;

      transform:
        translateY(30px)
        scale(0.95);
    }

    to {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }
  }


  /* ============================================
     موبایل
     ============================================ */

  @media (max-width: 600px) {

    .notification-modal {
      padding: 12px;
    }

    .notification-modal-overlay {
      padding: 12px;
    }

    .notification-modal-content {
      width: 100%;

      max-width: 100%;

      max-height: calc(100vh - 24px);

      padding:
        30px
        22px
        24px;

      border-radius: 14px;
    }

    .notification-modal-icon {
      font-size: 48px;

      margin-bottom: 12px;
    }

    .notification-modal-title {
      font-size: 20px;
    }

    .notification-modal-text {
      font-size: 14px;

      line-height: 1.8;
    }

    .notification-modal-actions {
      flex-direction: column;
    }

    .notification-modal-actions .btn {
      width: 100%;

      min-width: 0;
    }
  }


  /* ============================================
     موبایل خیلی کوچک
     ============================================ */

  @media (max-width: 380px) {

    .notification-modal-content {
      padding:
        24px
        18px
        20px;
    }

    .notification-modal-icon {
      font-size: 42px;
    }

    .notification-modal-title {
      font-size: 18px;
    }

    .notification-modal-text {
      font-size: 13px;
    }
  }
</style>
