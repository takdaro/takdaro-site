<style>

/* =========================

  max-width: 620px;

  border-radius: 30px;

  box-shadow:

    0 2px 8px rgba(0, 0, 0, 0.04);

  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);

  z-index: 99999;

  direction: rtl;
}

   Items
   ========================= */

.modern-nav-item {

  display: flex;

  align-items: center;

  gap: 4px;

  position: relative;

  color: #444;

  text-decoration: none;

  border-radius: 25px;

  transition:

}


/* Click */

}

<script>
document.addEventListener("DOMContentLoaded", function () {

  const items = document.querySelectorAll(".modern-nav-item");

  const path = window.location.pathname.toLowerCase();


  /* تشخیص صفحه فعال */

  items.forEach(function (item) {

    const nav = item.dataset.nav;

    let active = false;


    if (
      nav === "account" &&
      path.includes("account")
    ) {
      active = true;
    }


    if (
      nav === "shop" &&
      (
        path.includes("products") ||
        path.includes("product")
      )
    ) {
      active = true;
    }


    if (
      nav === "cart" &&
      (
        path.includes("checkout") ||
        path.includes("cart")
      )
    ) {
      active = true;
    }


    if (active) {
      item.classList.add("active");
    }

  });


  /* بروزرسانی Badge سبد خرید */

  function updateBottomCartBadge(count) {

    const badges =
      document.querySelectorAll("[data-cart-count-badge]");

    const number = parseInt(count || 0, 10);


    badges.forEach(function (badge) {

      if (number > 0) {

        badge.textContent =
          number > 99 ? "99+" : number;

        badge.classList.remove(
          "modern-cart-badge--hidden"
        );

      } else {

        badge.textContent = "0";

        badge.classList.add(
          "modern-cart-badge--hidden"
        );

      }

    });

  }


  /* قابل استفاده از JS اصلی سایت */

  window.updateBottomCartBadge =
    updateBottomCartBadge;

});
</script>
