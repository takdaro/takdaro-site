<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ثبت نام | تک تجارت</title>
  <meta name="description" content="ایجاد حساب کاربری در تک تجارت" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Shabnam", sans-serif;
    }

    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow-md);
      padding: 28px;
      border: 1px solid var(--border);
    }

    .auth-title {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      color: var(--primary);
    }

    .auth-subtitle {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
      text-align: center;
    }

    .auth-form {
      display: grid;
      gap: 16px;
    }

    .form-group {
      display: grid;
      gap: 8px;
    }

    .form-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-soft);
    }

    .form-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 15px;
      box-sizing: border-box;
      background: #fff;
      outline: none;
      color: var(--text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(33, 158, 188, 0.12);
    }

    .auth-button {
      height: 48px;
      border: none;
      border-radius: 12px;
      background: var(--secondary);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .auth-button:hover {
      background: #1a8aa8;
      transform: translateY(-1px);
    }

    .auth-button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .auth-message {
      display: none;
      min-height: 24px;
      font-size: 14px;
      text-align: center;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .auth-message.is-error {
      display: block;
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .auth-message.is-success {
      display: block;
      color: var(--success);
      background: var(--secondary-soft);
      border: 1px solid #bbf7d0;
    }

    .auth-message.is-info {
      display: block;
      color: var(--secondary);
      background: rgba(33, 158, 188, 0.08);
      border: 1px solid rgba(33, 158, 188, 0.2);
    }

    .auth-footer {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .auth-footer a {
      color: var(--secondary);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .registration-disabled-message {
      padding: 20px;
      background: rgba(33, 158, 188, 0.06);
      border: 1px solid rgba(33, 158, 188, 0.15);
      border-radius: 16px;
      text-align: center;
      line-height: 2.2;
      color: var(--text-soft);
      font-size: 1.05rem;
    }

    .registration-disabled-message strong {
      color: var(--secondary);
      font-size: 1.1rem;
    }

    .registration-disabled-message .phone-number {
      display: inline-block;
      direction: ltr;
      font-weight: 700;
      color: var(--primary);
      font-size: 1.2rem;
      padding: 4px 12px;
      background: rgba(33, 158, 188, 0.08);
      border-radius: 8px;
      margin: 4px 0;
    }

    .auth-form-hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <h1 class="auth-title">ایجاد حساب کاربری</h1>
      <p class="auth-subtitle">برای ادامه، اطلاعات خود را وارد کنید.</p>

      <!-- ==========================================
      پیام غیرفعال بودن ثبت‌نام
      ========================================== -->
      <div id="registration-disabled-message" class="registration-disabled-message" style="display:none;">
        <p style="margin:0 0 12px;">
          ثبت‌نام کاربر توسط مدیریت سایت انجام می‌شود.
        </p>
        <p style="margin:0;">
          لطفاً با پشتیبانی با شماره 
          <span class="phone-number">۰۹۲۱۴۱۴۷۰۷۰</span>
          تماس حاصل فرمایید.
        </p>
      </div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="auth-message" data-auth-message></div>

        <div class="form-group">
          <label class="form-label" for="full_name">نام و نام خانوادگی</label>
          <input
            id="full_name"
            name="full_name"
            class="form-input"
            type="text"
            placeholder="مثلاً علی رضایی"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">شماره موبایل</label>
          <input
            id="phone"
            name="phone"
            class="form-input"
            type="tel"
            placeholder="مثلاً 09123456789"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="email">ایمیل</label>
          <input
            id="email"
            name="email"
            class="form-input"
            type="email"
            placeholder="example@mail.com"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">رمز عبور</label>
          <input
            id="password"
            name="password"
            class="form-input"
            type="password"
            placeholder="حداقل 6 کاراکتر"
            required
          />
        </div>

        <button class="auth-button" type="submit">ثبت نام</button>
      </form>

      <div class="auth-footer">
        قبلاً حساب ساخته‌ای؟
        <a href="./login.html">ورود</a>
      </div>
    </section>
  </main>

  <div id="bottom-nav"></div>

  <script src="/assets/js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      if (!window.Auth) return;

      await window.Auth.redirectIfAuthenticated({
        redirectTo: "/account.html"
      });

      // ==========================================
      // بررسی وضعیت ثبت‌نام عمومی
      // ==========================================
      const disabledMessage = document.getElementById('registration-disabled-message');
      const registerForm = document.getElementById('register-form');

      async function checkRegistrationStatus() {
        try {
          const response = await fetch('/api/admin/settings', {
            credentials: 'same-origin',
            headers: { Accept: 'application/json' }
          });
          const data = await response.json().catch(() => null);

          if (!response.ok || !data?.success) {
            // در صورت خطا، فرم را نشان بده
            registerForm.style.display = 'grid';
            disabledMessage.style.display = 'none';
            return;
          }

          const settings = data.settings || {};
          const isEnabled = String(settings.allow_public_registration || 'true').toLowerCase() === 'true';

          if (isEnabled) {
            // ثبت‌نام فعال است - فرم را نشان بده
            registerForm.style.display = 'grid';
            disabledMessage.style.display = 'none';
          } else {
            // ثبت‌نام غیرفعال است - پیام را نشان بده
            registerForm.style.display = 'none';
            disabledMessage.style.display = 'block';
          }
        } catch (_) {
          // در صورت خطا، فرم را نشان بده
          registerForm.style.display = 'grid';
          disabledMessage.style.display = 'none';
        }
      }

      // بررسی وضعیت در هنگام بارگذاری صفحه
      await checkRegistrationStatus();

      // ==========================================
      // اتصال فرم ثبت‌نام به Auth
      // ==========================================
      window.Auth.bindRegisterForm({
        formSelector: "#register-form",
        messageSelector: "[data-auth-message]",
        redirectAfterSuccess: "/login.html"
      });
    });
  </script>
</body>
</html>
