<!-- ========================================== -->
<!-- WALLET                                    -->
<!-- ========================================== -->
<div class="wallet-shell">
  <div class="wallet-toolbar">
    <div class="form-field">
      <label for="wallet-user-id">شناسه کاربر</label>
      <input id="wallet-user-id" type="number" min="1" placeholder="مثلاً 1" />
    </div>
    <div class="form-field">
      <label for="wallet-quick-type">نوع سریع</label>
      <select id="wallet-quick-type">
        <option value="">همه نوع‌ها</option>
        <option value="credit">واریز</option>
        <option value="debit">برداشت</option>
        <option value="cashback">کش‌بک</option>
        <option value="refund">بازگشت وجه</option>
        <option value="adjustment">تعدیل</option>
      </select>
    </div>
    <div class="form-field">
      <label for="wallet-limit">تعداد تراکنش</label>
      <select id="wallet-limit">
        <option value="20">20</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="200">200</option>
      </select>
    </div>
    <div class="form-field" style="justify-content:flex-end;">
      <label style="opacity:0;">اقدام</label>
      <button class="btn btn-primary" type="button" id="wallet-load-btn">بارگذاری کیف پول</button>
    </div>
  </div>

  <div id="wallet-empty-state" class="wallet-empty">
    برای مشاهده و مدیریت کیف پول، شناسه کاربر را وارد کن و روی «بارگذاری کیف پول» بزن.
  </div>

  <div id="wallet-content" class="admin-hidden">
    <div class="wallet-overview">
      <div id="wallet-hero-card" class="wallet-hero"></div>
      <div id="wallet-summary-cards" class="wallet-summary-grid"></div>
    </div>

    <div class="wallet-grid">
      <div id="wallet-user-box" class="wallet-user-card"></div>
      <div id="wallet-adjust-box" class="wallet-adjust-card"></div>
    </div>

    <div id="wallet-settings-box" class="wallet-settings-card"></div>
    <div id="wallet-history-box" class="wallet-history-card"></div>
  </div>
</div>
