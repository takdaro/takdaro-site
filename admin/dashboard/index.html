<!-- DASHBOARD                                 -->
<!-- ========================================== -->
<div class="stats-grid">
  <div class="stat-card"><span>کل کاربران</span><strong id="stat-users">0</strong></div>
  <div class="stat-card"><span>کل سفارش‌ها</span><strong id="stat-orders">0</strong></div>
  <div class="stat-card"><span>سفارش‌های معلق</span><strong id="stat-pending">0</strong></div>
  <div class="stat-card"><span>درآمد کل</span><strong id="stat-revenue">0</strong></div>
  <div class="stat-card"><span>جمع کیف پول</span><strong id="stat-wallet">0</strong></div>
</div>

<section class="dashboard-currency-card" aria-live="polite">
  <div class="dashboard-currency-icon" aria-hidden="true">💵</div>
  <div class="dashboard-currency-content">
    <span class="dashboard-currency-label">نرخ فعلی دلار (USD)</span>
    <strong id="dashboard-usd-rate">در حال دریافت نرخ...</strong>
    <small id="dashboard-usd-rate-meta">منبع: مدیریت نرخ ارز</small>
  </div>
  <button class="dashboard-currency-action" type="button" id="dashboard-open-rates">مدیریت نرخ ارز</button>
</section>

<div class="detail-card">
  <h4>آخرین کاربران</h4>
  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>شناسه</th>
          <th>نام</th>
          <th>ایمیل</th>
          <th>نقش</th>
          <th>تاریخ</th>
        </tr>
      </thead>
      <tbody id="latest-users-body"></tbody>
    </table>
  </div>
</div>

<div class="detail-card">
  <h4>آخرین سفارش‌ها</h4>
  <div class="table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>شماره سفارش</th>
          <th>وضعیت</th>
          <th>مبلغ</th>
          <th>تاریخ</th>
        </tr>
      </thead>
      <tbody id="latest-orders-body"></tbody>
    </table>
  </div>
</div>
