<!-- ========================================== -->
<!-- ORDERS                                    -->
<!-- ========================================== -->
<div class="filters-grid">
  <div class="form-field">
    <label for="orders-search">جستجو</label>
    <input id="orders-search" type="text" placeholder="شماره سفارش، نام یا ایمیل" />
  </div>
  <div class="form-field">
    <label for="orders-status">وضعیت سفارش</label>
    <select id="orders-status">
      <option value="">همه</option>
      <option value="payment_pending">در انتظار پرداخت</option>
      <option value="payment_success">پرداخت موفق</option>
      <option value="payment_failed">پرداخت ناموفق</option>
      <option value="order_confirmed">تأیید سفارش</option>
      <option value="courier_delivery">ارسال با پیک</option>
      <option value="bus_shipping">ارسال با باربری</option>
      <option value="shipped">ارسال شد</option>
      <option value="delivered">تحویل داده شد</option>
      <option value="completed">تکمیل شد</option>
      <option value="cancelled">لغو شد</option>
      <option value="returned">مرجوع شد</option>
    </select>
  </div>
  <div class="form-field">
    <label for="orders-payment-status">وضعیت پرداخت</label>
    <select id="orders-payment-status">
      <option value="">همه</option>
      <option value="pending">در انتظار پرداخت</option>
      <option value="paid">پرداخت شده</option>
      <option value="failed">پرداخت ناموفق</option>
      <option value="refunded">بازگشت وجه</option>
    </select>
  </div>
  <div class="form-field" style="justify-content:flex-end;">
    <label style="opacity:0;">اقدام</label>
    <button class="btn btn-primary" type="button" id="orders-filter-btn">اعمال فیلتر</button>
  </div>
</div>

<div class="table-wrap">
  <table class="admin-table">
    <thead>
      <tr>
        <th>شماره سفارش</th>
        <th>کاربر</th>
        <th>ایمیل</th>
        <th>وضعیت</th>
        <th>مبلغ فاکتور</th>
        <th>برداشت از کیف پول</th>
        <th>مانده پرداخت</th>
        <th>تاریخ</th>
        <th>اقدام</th>
      </tr>
    </thead>
    <tbody id="orders-body"></tbody>
  </table>
</div>

<div id="order-detail" class="detail-card admin-hidden"></div>
